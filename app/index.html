<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Антиспам NLP</title><style>body{font:18px system-ui;background:#f1f5f9;color:#111827;max-width:800px;margin:60px auto;padding:24px}textarea{box-sizing:border-box;width:100%;min-height:220px;padding:16px;font:16px system-ui;border:1px solid #94a3b8;border-radius:8px}button{background:#172554;color:white;border:0;border-radius:8px;padding:14px 28px;font:inherit;cursor:pointer}#result{white-space:pre-wrap;margin-top:24px}small{color:#475569}h1{font-size:42px}</style><h1>Антиспам NLP</h1><p>Проверка текста письма с помощью TF-IDF и обученного классификатора.</p><form id="form"><textarea id="email" maxlength="50000" required placeholder="Вставьте тему и текст письма на английском языке"></textarea><p><button id="check">Проверить письмо</button></p></form><div id="result" role="status"></div><p><small>Учебная модель на исторических англоязычных письмах. Оценка модели не является гарантией безопасности. Текст обрабатывает этот сервер.</small></p><a href="/docs">Документация API</a><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('check'),r=document.getElementById('result');b.disabled=true;r.textContent='Проверяю…';try{const a=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:document.getElementById('email').value})});if(!a.ok)throw Error('Ошибка запроса: '+a.status);const x=await a.json();r.textContent=(x.label==='spam'?'Спам':'Обычное письмо')+'\nОценка спама: '+(x.spam_score*100).toFixed(1)+'%\nПорог: '+x.threshold.toFixed(2)}catch(err){r.textContent=err.message}finally{b.disabled=false}};</script></html>
